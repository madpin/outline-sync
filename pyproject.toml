[project]
name = "outline-sync"
version = "0.1.0"
description = "Syncs an Outline wiki with a local markdown folder for use with AI coding assistants"
authors = [
    { name = "Thiago MadPin", email = "madpin@gmail.com" }
]
license = { file = "LICENSE.md" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.scripts]
outline-sync = "outs.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outs"]
